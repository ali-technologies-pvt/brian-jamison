  <!-- Exact script requested by user for Jamison Real Estate Widget #20754 -->
  <script charset="UTF-8" type="text/javascript" id="idxwidgetsrc-20754" src="//jamisonrealestateokc.idxbroker.com/idx/quicksearchjs.php?widgetid=20754"></script>

  <script>
    function sendHeight() {
      try {
        var h = document.body.scrollHeight || document.documentElement.scrollHeight;
        if (h && window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'IDX_WIDGET_RESIZE', height: h }, '*');
        }
      } catch (e) {}
    }
    window.addEventListener('load', function() {
      sendHeight();
      setTimeout(sendHeight, 300);
      setTimeout(sendHeight, 800);
      setTimeout(sendHeight, 1500);
      setTimeout(sendHeight, 3000);
    });
    window.addEventListener('resize', sendHeight);
  </script>
